<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0d1220" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Jogo de puzzle de programacao: monte uma sequencia de comandos e leve o robo a acender todos os ladrilhos."
    />
    <title>Robo de Luz — puzzle de programacao</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <button type="button" id="btn-levels" class="ghost-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
          <span>Fases</span>
        </button>

        <div class="level-info">
          <span class="level-num" id="level-num">Fase 1</span>
          <h1 class="level-name" id="level-name">—</h1>
        </div>

        <div class="lights" id="lights" aria-live="polite">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              d="M12 3a6 6 0 0 1 3.4 10.9c-.5.4-.8 1-.8 1.6H9.4c0-.6-.3-1.2-.8-1.6A6 6 0 0 1 12 3zM9.5 18.5h5M10.5 21h3"/>
          </svg>
          <span id="lights-text">0/0</span>
        </div>
      </header>

      <main class="stage">
        <canvas id="scene"></canvas>

        <div class="stage-tools">
          <button type="button" id="btn-hint" class="ghost-btn small">Dica</button>
          <button type="button" id="btn-view" class="ghost-btn small" title="Recentralizar a camera">Camera</button>
          <button type="button" id="btn-audio" class="ghost-btn small icon-only" aria-label="Som">
            <span id="btn-audio-icon"></span>
          </button>
        </div>

        <div class="banner hidden" id="banner" role="status">
          <p class="banner-text" id="banner-text"></p>
          <div class="banner-actions" id="banner-actions"></div>
        </div>
      </main>

      <footer class="dock">
        <div id="editor" class="editor"></div>

        <div class="controls">
          <button type="button" id="btn-clear" class="ghost-btn">Limpar</button>
          <button type="button" id="btn-speed" class="ghost-btn" title="Velocidade da execucao">1x</button>
          <button type="button" id="btn-run" class="primary-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>
            <span id="btn-run-text">Executar</span>
          </button>
        </div>
      </footer>
    </div>

    <dialog id="levels-dialog" class="dialog">
      <div class="dialog-head">
        <h2>Fases</h2>
        <button type="button" id="btn-close-levels" class="ghost-btn small">Fechar</button>
      </div>
      <div class="level-grid" id="level-grid"></div>
      <footer class="dialog-foot">
        <button type="button" id="btn-reset-progress" class="ghost-btn small danger">Apagar progresso</button>
      </footer>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
