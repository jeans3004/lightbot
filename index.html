<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#00cdff" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Jogo de puzzle de programacao: monte uma sequencia de comandos e leve o robo a acender todos os ladrilhos."
    />
    <title>Robô de Luz</title>
  </head>
  <body>
    <!-- ================================================== splash -->
    <section id="screen-splash" class="screen splash">
      <div class="logo">
        <svg class="logo-robot" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="8" r="4" fill="#fff"/>
          <path d="M32 12v6" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <path d="M14 42a18 18 0 0 1 36 0z" fill="#fff"/>
          <circle cx="25" cy="34" r="5" fill="#00cdff"/>
          <circle cx="39" cy="34" r="5" fill="#00cdff"/>
          <circle cx="12" cy="44" r="4.5" fill="#fff"/>
          <circle cx="52" cy="44" r="4.5" fill="#fff"/>
        </svg>
        <span class="logo-text">Robô de Luz</span>
      </div>
      <p class="splash-tap">Toque para começar</p>
    </section>

    <!-- =============================================== capitulos -->
    <section id="screen-chapters" class="screen menu hidden">
      <div class="menu-top">
        <button type="button" class="sq-btn cyan" id="chapters-back" aria-label="Voltar">
          <svg viewBox="0 0 24 24"><path fill="#fff" d="M16 4v16L6 12z"/></svg>
        </button>
        <div class="menu-title">
          <span class="menu-num" id="chapter-num">1</span>
          <span class="menu-name" id="chapter-name">Básico</span>
        </div>
        <div class="stars-pill">
          <span id="chapter-stars">0/20</span>
          <svg viewBox="0 0 24 24" class="star-icon"><path fill="#ffd21e" stroke="#e0a800" stroke-width="1.2" stroke-linejoin="round" d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
        </div>
      </div>

      <div class="chapter-stage">
        <button type="button" class="arrow-btn left" id="chapter-prev" aria-label="Capítulo anterior">
          <svg viewBox="0 0 40 60"><path d="M34 4L8 30l26 26" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke" /><path d="M34 4L8 30l26 26" fill="none" stroke="#9aa9bd" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>

        <button type="button" class="chapter-card" id="chapter-card" aria-label="Abrir capítulo">
          <div class="chapter-preview" id="chapter-preview"></div>
          <div class="chapter-dots" id="chapter-dots"></div>
        </button>

        <button type="button" class="arrow-btn right" id="chapter-next" aria-label="Próximo capítulo">
          <svg viewBox="0 0 40 60"><path d="M6 4l26 26L6 56" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M6 4l26 26L6 56" fill="none" stroke="#9aa9bd" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
      </div>

      <button type="button" class="sq-btn ghost audio-btn" id="chapters-audio" aria-label="Som"></button>
    </section>

    <!-- =================================================== fases -->
    <section id="screen-levels" class="screen menu hidden">
      <div class="menu-top">
        <button type="button" class="sq-btn cyan" id="levels-back" aria-label="Voltar">
          <svg viewBox="0 0 24 24"><path fill="#fff" d="M16 4v16L6 12z"/></svg>
        </button>
        <div class="menu-title">
          <span class="menu-num" id="levels-chapter-num">1</span>
          <span class="menu-name" id="levels-chapter-name">Básico</span>
        </div>
        <div class="stars-pill">
          <span id="levels-stars">0/20</span>
          <svg viewBox="0 0 24 24" class="star-icon"><path fill="#ffd21e" stroke="#e0a800" stroke-width="1.2" stroke-linejoin="round" d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
        </div>
      </div>

      <div class="levels-body">
        <div class="mascot" aria-hidden="true">
          <svg viewBox="0 0 120 200">
            <circle cx="60" cy="14" r="8" fill="#b9c6da" stroke="#5f6f8b" stroke-width="3"/>
            <path d="M60 22v20" stroke="#5f6f8b" stroke-width="4" stroke-linecap="round"/>
            <circle cx="60" cy="82" r="42" fill="#b9c6da" stroke="#5f6f8b" stroke-width="3.5"/>
            <ellipse cx="44" cy="82" rx="12" ry="14" fill="#fff" stroke="#5f6f8b" stroke-width="3"/>
            <ellipse cx="76" cy="82" rx="12" ry="14" fill="#fff" stroke="#5f6f8b" stroke-width="3"/>
            <circle cx="60" cy="140" r="24" fill="#b9c6da" stroke="#5f6f8b" stroke-width="3.5"/>
            <circle cx="30" cy="132" r="11" fill="#b9c6da" stroke="#5f6f8b" stroke-width="3"/>
            <circle cx="90" cy="132" r="11" fill="#b9c6da" stroke="#5f6f8b" stroke-width="3"/>
            <ellipse cx="42" cy="180" rx="18" ry="10" fill="#9fb0c8" stroke="#5f6f8b" stroke-width="3"/>
            <ellipse cx="78" cy="180" rx="18" ry="10" fill="#9fb0c8" stroke="#5f6f8b" stroke-width="3"/>
          </svg>
        </div>
        <div class="level-grid" id="level-grid"></div>
      </div>

      <button type="button" class="sq-btn ghost audio-btn" id="levels-audio" aria-label="Som"></button>
    </section>

    <!-- ==================================================== jogo -->
    <section id="screen-game" class="screen game hidden">
      <div class="game-left">
        <div class="btn-row">
          <button type="button" class="sq-btn cyan" id="game-back" aria-label="Voltar">
            <svg viewBox="0 0 24 24"><path fill="#fff" d="M16 4v16L6 12z"/></svg>
          </button>
          <button type="button" class="sq-btn cyan" id="game-restart" aria-label="Recomeçar">
            <svg viewBox="0 0 24 24"><path d="M6 8.5A7 7 0 1 1 5.3 14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M4 4.5v5h5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button type="button" class="sq-btn ghost" id="game-speed" aria-label="Velocidade" title="Velocidade">
          <svg viewBox="0 0 24 24" id="game-speed-icon"><path fill="#9aa9bd" d="M4 5v14l8-7zM12 5v14l8-7z"/></svg>
        </button>
        <button type="button" class="sq-btn ghost audio-btn" id="game-audio" aria-label="Som"></button>
        <span class="level-label" id="level-label">1-1</span>
      </div>

      <div class="game-center">
        <canvas id="scene"></canvas>
        <div class="dialogue hidden" id="dialogue">
          <div class="dialogue-avatar" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <circle cx="32" cy="9" r="4" fill="#fff07a" stroke="#5f6f8b" stroke-width="1.5"/>
              <path d="M32 13v6" stroke="#5f6f8b" stroke-width="2"/>
              <circle cx="32" cy="34" r="16" fill="#b9c6da" stroke="#5f6f8b" stroke-width="1.6"/>
              <ellipse cx="26" cy="34" rx="4.5" ry="5.5" fill="#fff" stroke="#5f6f8b" stroke-width="1.4"/>
              <ellipse cx="38" cy="34" rx="4.5" ry="5.5" fill="#fff" stroke="#5f6f8b" stroke-width="1.4"/>
              <circle cx="32" cy="55" r="9" fill="#b9c6da" stroke="#5f6f8b" stroke-width="1.6"/>
              <circle cx="18" cy="52" r="4.5" fill="#b9c6da" stroke="#5f6f8b" stroke-width="1.4"/>
              <circle cx="46" cy="52" r="4.5" fill="#b9c6da" stroke="#5f6f8b" stroke-width="1.4"/>
            </svg>
          </div>
          <div class="speech" id="speech-text"></div>
        </div>
        <div class="palette" id="palette" role="group" aria-label="Comandos disponíveis"></div>
      </div>

      <div class="game-right">
        <div class="btn-row right">
          <button type="button" class="run-btn" id="game-run" aria-label="Executar">
            <svg viewBox="0 0 24 24" id="game-run-icon"><path fill="#fff" d="M7 4v16l13-8z"/></svg>
          </button>
          <button type="button" class="sq-btn cyan" id="game-hint" aria-label="Dica">
            <svg viewBox="0 0 24 24"><text x="12" y="18" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" font-family="ui-sans-serif, system-ui, sans-serif">?</text></svg>
          </button>
        </div>
        <div class="strips" id="strips" role="group" aria-label="Blocos de programa"></div>
      </div>

      <div class="overlay hidden" id="overlay">
        <div class="overlay-card" id="overlay-card">
          <p class="overlay-text" id="overlay-text"></p>
          <div class="overlay-actions" id="overlay-actions"></div>
        </div>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
